spring:
  application:
    name: appointment-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:mydatabase}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}

server:
  port: ${SERVER_PORT:8081}

app:
  messaging:
    history-exchange: ${HISTORY_EXCHANGE:history.exchange}
    history-routing-key: ${HISTORY_ROUTING_KEY:history.created}
    notification-exchange: ${NOTIFICATION_EXCHANGE:notification.exchange}
    notification-routing-key: ${NOTIFICATION_ROUTING_KEY:notification.created}
    publish-notification: ${PUBLISH_NOTIFICATION:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
